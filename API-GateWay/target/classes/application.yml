server:
  port: 9090

app:
  api-key: ${apikey}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      default-filters:
        - name: AddResponseHeader
          args:
            name: X-Content-Type-Options
            value: nosniff
        - name: AddResponseHeader
          args:
            name: X-Frame-Options
            value: DENY
        - name: AddResponseHeader
          args:
            name: X-XSS-Protection
            value: "1; mode=block"
        - name: AddResponseHeader
          args:
            name: Referrer-Policy
            value: strict-origin-when-cross-origin

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/Users/**
          filters:
            - ApiKeyValidation
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: farmer-service
          uri: lb://farmer-service
          predicates:
            - Path=/farmer/**
          filters:
            - ApiKeyValidation
            - name: JwtValidation
              args:
                allowedRoles: FARMER

        - id: farmer-goods-service-block-internal
          uri: lb://farmer-goods-service
          predicates:
            - Path=/products/reduce-stock/**
          filters:
            - name: SetStatus
              args:
                status: 403

        - id: farmer-goods-service
          uri: lb://farmer-goods-service
          predicates:
            - Path=/products/**
          filters:
            - ApiKeyValidation
            - name: JwtValidation
              args:
                allowedRoles: FARMER,BUYER

        - id: buyer-service
          uri: lb://buyer-service
          predicates:
            - Path=/buyer/**
          filters:
            - ApiKeyValidation
            - name: JwtValidation
              args:
                allowedRoles: BUYER

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
          filters:
            - ApiKeyValidation
            - name: JwtValidation
              args:
                allowedRoles: FARMER,BUYER

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - ApiKeyValidation
            - name: JwtValidation
              args:
                allowedRoles: FARMER,BUYER

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/Ai/**
          filters:
            - ApiKeyValidation
            - name: JwtValidation
              args:
                allowedRoles: FARMER,BUYER
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka}@localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
