spring.application.name=Order-Service
spring.cloud.config.enabled=false
server.port=8080

# Datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/AuthuService?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka}@localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Feign timeouts
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVER:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1

# Kafka Topics
kafka.topic.order-placed=order-placed
kafka.topic.order-status-updated=order-status-updated

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.farmer-goods-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.farmer-goods-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.farmer-goods-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.farmer-goods-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.farmer-goods-service.automatic-transition-from-open-to-half-open-enabled=true
